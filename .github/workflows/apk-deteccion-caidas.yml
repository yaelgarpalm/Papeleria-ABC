name: APK detección de caídas

on:
  push:
    branches: [claude/determined-gates-tico1l]
    paths:
      - 'deteccion-caidas/**'
      - '!deteccion-caidas/apk/**'
      - '.github/workflows/apk-deteccion-caidas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deteccion-caidas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Pruebas y APK de depuración
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace test assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: deteccion-caidas-debug
          path: deteccion-caidas/app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar el APK en la rama
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/deteccion-caidas-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/deteccion-caidas-debug.apk
          git commit -m "APK de depuración generado por CI [skip ci]" || exit 0
          git push
